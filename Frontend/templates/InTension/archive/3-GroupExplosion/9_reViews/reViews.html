<body>
    <header class="header">
        <div class="header__container">
            <a class="container__logo" href="/index.html">

        </div>
        <div class="intension__container">
            <a href="/Frontend/templates/InTension/in-tension.html"><img class="intension__logo" src="/Frontend/assets/logos/intensionheader.svg" alt=""></a>

        <nav class="header__nav">
            <label class="nav__label">

    <section class="banner">

            <div class="section__text">

            </div>

    <a href="/Frontend/templates/InTension/in-tension.html#content_section">
